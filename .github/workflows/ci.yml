name: CI

# Runs automatically on every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Alter.csproj

      - name: Check formatting
        run: dotnet format Alter.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Alter.csproj -c Release --no-restore

      # No test project exists yet; this picks up any *Tests.csproj added later.
      - name: Test
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter *Tests.csproj
          if (-not $tests) { Write-Host 'No test projects found, skipping.'; exit 0 }
          foreach ($t in $tests) { dotnet test $t.FullName -c Release; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
